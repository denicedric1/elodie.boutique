<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Suivi de commande - Elodie Boutique
    </title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f5f5f5;

            margin: 0;

            padding: 30px;

        }


        .container {

            max-width: 700px;

            margin: auto;

        }


        h1 {

            color: #222;

        }


        .recherche {

            background: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

        }


        input {

            width: 100%;

            padding: 12px;

            box-sizing: border-box;

            margin-top: 10px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;

        }


        button {

            padding: 12px 18px;

            margin-top: 15px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            background-color: #222;

            color: white;

            font-size: 15px;

        }


        button:hover {

            opacity: 0.8;

        }


        .commande {

            background: white;

            padding: 20px;

            margin-top: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

        }


        .statut {

            font-size: 20px;

            font-weight: bold;

            margin-top: 15px;

        }


        .progression {

            margin-top: 25px;

        }


        .etape {

            padding: 12px;

            margin-top: 8px;

            border-radius: 6px;

            background-color: #eeeeee;

        }


        .active {

            background-color: #222;

            color: white;

            font-weight: bold;

        }


        .termine {

            background-color: #d9f2d9;

            font-weight: bold;

        }


        .erreur {

            color: red;

            margin-top: 15px;

        }


        .livreur {

            margin-top: 15px;

            padding: 12px;

            background-color: #f0f0f0;

            border-radius: 6px;

            font-weight: bold;

        }


        .actualisation {

            margin-top: 15px;

            color: #777;

            font-size: 13px;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Suivi de votre commande
    </h1>


    <div class="recherche">


        <label for="numeroCommande">

            Entrez votre numéro de commande :

        </label>


        <input
            type="text"
            id="numeroCommande"
            placeholder="Exemple : ELD-20260815-0001"
        >


        <button
            onclick="rechercherCommande()"
        >

            Suivre ma commande

        </button>


        <div id="message"></div>


    </div>


    <div id="resultat"></div>


</div>


<script>


    let numeroCommandeSuivie = null;


    let actualisation = null;


    async function rechercherCommande() {


        const numero = document

            .getElementById(
                "numeroCommande"
            )

            .value

            .trim();


        const message =
            document.getElementById(
                "message"
            );


        const resultat =
            document.getElementById(
                "resultat"
            );


        message.innerHTML = "";

        resultat.innerHTML = "";


        if (!numero) {

            message.innerHTML =

                '<p class="erreur">' +

                'Veuillez entrer un numéro de commande.' +

                '</p>';

            return;

        }


        try {


            const reponse =

                await fetch(
                    "/api/commandes"
                );


            if (!reponse.ok) {

                throw new Error(
                    "Erreur serveur"
                );

            }


            const commandes =

                await reponse.json();


            const commande =

                commandes.find(
                    function(c) {

                        return (

                            c.numero_commande
                                .toLowerCase()

                            ===

                            numero
                                .toLowerCase()

                        );

                    }
                );


            if (!commande) {

                message.innerHTML =

                    '<p class="erreur">' +

                    'Commande introuvable.' +

                    '</p>';

                return;

            }


            numeroCommandeSuivie =
                commande.numero_commande;


            afficherCommande(
                commande
            );


            demarrerActualisation();

        }


        catch (erreur) {

            console.log(
                erreur
            );


            message.innerHTML =

                '<p class="erreur">' +

                'Impossible de récupérer la commande.' +

                '</p>';

        }

    }


    function afficherCommande(
        commande
    ) {


        const resultat =
            document.getElementById(
                "resultat"
            );


        const etapes = [

            "Commande reçue",

            "Commande validée",

            "Livreur attribué",

            "Colis récupéré",

            "En route vers le client",

            "Livraison en cours",

            "Commande livrée"

        ];


        const statutActuel =
            etapes.indexOf(
                commande.statut
            );


        let progression = "";


        etapes.forEach(
            function(
                etape,
                index
            ) {


                let classe =
                    "etape";


                if (
                    index < statutActuel
                ) {

                    classe +=
                        " termine";

                }


                if (
                    index === statutActuel
                ) {

                    classe +=
                        " active";

                }


                progression += `

                    <div
                        class="${classe}"
                    >

                        ${
                            index < statutActuel
                                ? "✓ "
                                : ""
                        }

                        ${etape}

                    </div>

                `;

            }
        );


        resultat.innerHTML = `

            <div class="commande">


                <h2>

                    Commande
                    ${commande.numero_commande}

                </h2>


                <p>

                    <strong>
                        Client :
                    </strong>

                    ${commande.nom_client}

                </p>


                <p>

                    <strong>
                        Produit :
                    </strong>

                    ${commande.produits}

                </p>


                <p>

                    <strong>
                        Total :
                    </strong>

                    ${Number(
                        commande.total
                    ).toLocaleString(
                        "fr-FR"
                    )}

                    FCFA

                </p>


                <p>

                    <strong>
                        Ville :
                    </strong>

                    ${commande.ville}

                </p>


                <p>

                    <strong>
                        Commune :
                    </strong>

                    ${commande.commune}

                </p>


                <p>

                    <strong>
                        Quartier :
                    </strong>

                    ${commande.quartier}

                </p>


                <p>

                    <strong>
                        Adresse :
                    </strong>

                    ${commande.adresse}

                </p>


                <div class="livreur">

                    🚚 Livreur :

                    ${
                        commande.livreur
                        ||
                        "Pas encore attribué"
                    }

                </div>


                <p class="statut">

                    📊 Statut actuel :

                    ${commande.statut}

                </p>


                <div class="progression">


                    <h3>

                        Progression
                        de la livraison

                    </h3>


                    ${progression}


                </div>


                <div class="actualisation">

                    🔄 Le suivi se met
                    automatiquement à jour.

                </div>


            </div>

        `;

    }


    async function actualiserCommande() {


        if (
            !numeroCommandeSuivie
        ) {

            return;

        }


        try {


            const reponse =

                await fetch(
                    "/api/commandes"
                );


            if (!reponse.ok) {

                return;

            }


            const commandes =

                await reponse.json();


            const commande =

                commandes.find(
                    function(c) {

                        return (

                            c.numero_commande

                            ===

                            numeroCommandeSuivie

                        );

                    }
                );


            if (commande) {

                afficherCommande(
                    commande
                );

            }

        }


        catch (erreur) {

            console.log(
                "Erreur actualisation :",
                erreur
            );

        }

    }


    function demarrerActualisation() {


        if (actualisation) {

            clearInterval(
                actualisation
            );

        }


        actualisation =

            setInterval(
                actualiserCommande,
                5000
            );

    }


    document

        .getElementById(
            "numeroCommande"
        )

        .addEventListener(
            "keydown",
            function(e) {

                if (
                    e.key === "Enter"
                ) {

                    rechercherCommande();

                }

            }
        );


</script>


</body>

</html>
