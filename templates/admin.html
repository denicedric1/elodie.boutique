<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administration - Elodie Boutique</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f4f6f8;

            margin: 0;

            padding: 20px;

        }


        .entete {

            background: white;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);

        }


        .entete h1 {

            margin: 0;

            color: #222;

        }


        .sous-titre {

            margin-top: 8px;

            color: #666;

        }


        .actualisation {

            margin-top: 6px;

            color: #888;

            font-size: 13px;

        }


        button {

            border: none;

            border-radius: 7px;

            padding: 9px 12px;

            cursor: pointer;

            font-size: 14px;

        }


        button:hover {

            opacity: 0.85;

        }


        .bouton-deconnexion {

            background-color: #c62828;

            color: white;

        }


        .statistiques {

            display: grid;

            grid-template-columns: repeat(6, 1fr);

            gap: 15px;

            margin-bottom: 25px;

        }


        .carte-statistique {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);

            text-align: center;

        }


        .carte-statistique h2 {

            margin: 0;

            font-size: 30px;

        }


        .carte-statistique p {

            color: #666;

            margin-bottom: 0;

        }


        .chiffre-affaires {

            font-size: 22px !important;

        }


        .section {

            background: white;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);

        }


        .section h2 {

            margin-top: 0;

        }


        .table-container {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 1100px;

        }


        th,

        td {

            padding: 12px;

            border-bottom: 1px solid #ddd;

            text-align: left;

            vertical-align: middle;

        }


        th {

            background-color: #f1f3f5;

        }


        tr:hover {

            background-color: #fafafa;

        }


        .statut {

            font-weight: bold;

        }


        .livreur {

            font-weight: bold;

        }


        .actions {

            display: flex;

            flex-direction: column;

            gap: 8px;

        }


        .actions select {

            padding: 9px;

            border: 1px solid #ccc;

            border-radius: 6px;

            min-width: 180px;

            background: white;

        }


        .bouton-reattribuer {

            background-color: #1565c0;

            color: white;

        }


        .bouton-statut {

            background-color: #2e7d32;

            color: white;

        }


        .message {

            text-align: center;

            color: #777;

            padding: 25px;

        }


        .notification {

            position: fixed;

            top: 20px;

            right: 20px;

            padding: 15px 20px;

            border-radius: 8px;

            color: white;

            display: none;

            z-index: 9999;

            box-shadow: 0 3px 10px rgba(0,0,0,0.2);

        }


        .notification.succes {

            background-color: #2e7d32;

        }


        .notification.erreur {

            background-color: #c62828;

        }


        .liste-livreurs {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 15px;

        }


        .carte-livreur {

            padding: 15px;

            background-color: #f5f5f5;

            border-radius: 8px;

            font-weight: bold;

        }


        @media (max-width: 1100px) {

            .statistiques {

                grid-template-columns: repeat(3, 1fr);

            }

        }


        @media (max-width: 900px) {

            .liste-livreurs {

                grid-template-columns: repeat(2, 1fr);

            }

        }


        @media (max-width: 600px) {

            body {

                padding: 10px;

            }


            .entete {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;

            }


            .statistiques {

                grid-template-columns: 1fr;

            }


            .liste-livreurs {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <div
        id="notification"
        class="notification"
    ></div>


    <div class="entete">

        <div>

            <h1>
                👑 Administration
            </h1>

            <div class="sous-titre">

                Tableau de bord Elodie Boutique

            </div>

            <div class="actualisation">

                🔄 Actualisation automatique

            </div>

        </div>


        <button
            class="bouton-deconnexion"
            onclick="deconnexion()"
        >

            Déconnexion

        </button>

    </div>



    <div class="statistiques">


        <div class="carte-statistique">

            <h2 id="total-commandes">0</h2>

            <p>
                📦 Total commandes
            </p>

        </div>


        <div class="carte-statistique">

            <h2 id="commandes-recues">0</h2>

            <p>
                🟠 Commandes reçues
            </p>

        </div>


        <div class="carte-statistique">

            <h2 id="commandes-validees">0</h2>

            <p>
                ✔️ Validées
            </p>

        </div>


        <div class="carte-statistique">

            <h2 id="commandes-attribuees">0</h2>

            <p>
                🚚 Attribuées
            </p>

        </div>


        <div class="carte-statistique">

            <h2 id="commandes-en-cours">0</h2>

            <p>
                🛵 En livraison
            </p>

        </div>


        <div class="carte-statistique">

            <h2
                id="chiffre-affaires"
                class="chiffre-affaires"
            >
                0 FCFA
            </h2>

            <p>
                💰 Chiffre d'affaires
            </p>

        </div>

    </div>



    <div class="statistiques">

        <div class="carte-statistique">

            <h2 id="commandes-livrees">
                0
            </h2>

            <p>
                ✅ Commandes livrées
            </p>

        </div>

    </div>



    <div class="section">

        <h2>
            📋 Toutes les commandes
        </h2>


        <div
            class="table-container"
            id="table-commandes"
        >

            <div class="message">

                Chargement...

            </div>

        </div>

    </div>



    <div class="section">

        <h2>
            👥 Livreurs
        </h2>


        <div
            id="liste-livreurs"
            class="liste-livreurs"
        >

            <div class="message">

                Chargement...

            </div>

        </div>

    </div>



<script>


    let listeLivreurs = [];



    // =====================================================
    // NOTIFICATION
    // =====================================================

    function afficherNotification(message, type) {

        const notification =
            document.getElementById("notification");


        notification.textContent = message;

        notification.className =
            "notification " + type;

        notification.style.display = "block";


        setTimeout(function() {

            notification.style.display = "none";

        }, 3000);

    }



    // =====================================================
    // CHARGER LES COMMANDES
    // =====================================================

    async function chargerCommandes() {

        try {

            const reponse =
                await fetch("/api/commandes");


            if (!reponse.ok) {

                console.log(
                    "Impossible de charger les commandes."
                );

                return;

            }


            const commandes =
                await reponse.json();


            afficherStatistiques(commandes);

            afficherCommandes(commandes);


        }

        catch (erreur) {

            console.log(
                "Erreur commandes :",
                erreur
            );

        }

    }



    // =====================================================
    // STATISTIQUES
    // =====================================================

    function afficherStatistiques(commandes) {

        let recues = 0;

        let validees = 0;

        let attribuees = 0;

        let enCours = 0;

        let livrees = 0;

        let chiffreAffaires = 0;


        commandes.forEach(function(commande) {


            const statut =
                commande.statut;


            const total =
                Number(commande.total) || 0;


            chiffreAffaires += total;


            if (statut === "Commande reçue") {

                recues++;

            }


            if (statut === "Commande validée") {

                validees++;

            }


            if (statut === "Livreur attribué") {

                attribuees++;

            }


            if (

                statut === "Colis récupéré"

                ||

                statut === "En route"

                ||

                statut === "En route vers le client"

                ||

                statut === "Livraison en cours"

            ) {

                enCours++;

            }


            if (statut === "Commande livrée") {

                livrees++;

            }

        });


        document.getElementById(
            "total-commandes"
        ).textContent = commandes.length;


        document.getElementById(
            "commandes-recues"
        ).textContent = recues;


        document.getElementById(
            "commandes-validees"
        ).textContent = validees;


        document.getElementById(
            "commandes-attribuees"
        ).textContent = attribuees;


        document.getElementById(
            "commandes-en-cours"
        ).textContent = enCours;


        document.getElementById(
            "commandes-livrees"
        ).textContent = livrees;


        document.getElementById(
            "chiffre-affaires"
        ).textContent =

            chiffreAffaires.toLocaleString("fr-FR")

            + " FCFA";

    }



    // =====================================================
    // AFFICHER LES COMMANDES
    // =====================================================

    function afficherCommandes(commandes) {


        const conteneur =
            document.getElementById(
                "table-commandes"
            );


        if (commandes.length === 0) {

            conteneur.innerHTML = `

                <div class="message">

                    Aucune commande.

                </div>

            `;

            return;

        }


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>Commande</th>

                        <th>Client</th>

                        <th>Produit</th>

                        <th>Total</th>

                        <th>Statut</th>

                        <th>Livreur</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

        `;


        commandes.forEach(function(commande) {


            let optionsLivreurs = `

                <option value="">
                    Choisir un livreur
                </option>

            `;


            listeLivreurs.forEach(function(livreur) {


                const selectionne =

                    commande.livreur === livreur.nom
                    ? "selected"
                    : "";


                optionsLivreurs += `

                    <option
                        value="${livreur.nom}"
                        ${selectionne}
                    >

                        ${livreur.nom}

                    </option>

                `;

            });


            html += `

                <tr>

                    <td>
                        <strong>
                            ${commande.numero_commande}
                        </strong>
                    </td>


                    <td>
                        ${commande.nom_client}
                    </td>


                    <td>
                        ${commande.produits}
                    </td>


                    <td>

                        ${Number(
                            commande.total
                        ).toLocaleString("fr-FR")}

                        FCFA

                    </td>


                    <td class="statut">

                        ${commande.statut}

                    </td>


                    <td class="livreur">

                        ${
                            commande.livreur
                            ||
                            "Non attribué"
                        }

                    </td>


                    <td>

                        <div class="actions">


                            <select
                                id="livreur-${commande.id}"
                            >

                                ${optionsLivreurs}

                            </select>


                            <button
                                class="bouton-reattribuer"
                                onclick="reattribuerCommande(${commande.id})"
                            >

                                🚚 Réattribuer

                            </button>


                            <select
                                id="statut-${commande.id}"
                            >

                                <option value="">
                                    Modifier le statut
                                </option>

                                <option value="Commande reçue">
                                    Commande reçue
                                </option>

                                <option value="Commande validée">
                                    Commande validée
                                </option>

                                <option value="Livreur attribué">
                                    Livreur attribué
                                </option>

                                <option value="Colis récupéré">
                                    Colis récupéré
                                </option>

                                <option value="En route vers le client">
                                    En route vers le client
                                </option>

                                <option value="Livraison en cours">
                                    Livraison en cours
                                </option>

                                <option value="Commande livrée">
                                    Commande livrée
                                </option>

                            </select>


                            <button
                                class="bouton-statut"
                                onclick="modifierStatut(${commande.id})"
                            >

                                🔄 Modifier statut

                            </button>


                        </div>

                    </td>

                </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        `;


        conteneur.innerHTML = html;

    }



    // =====================================================
    // CHARGER LES LIVREURS
    // =====================================================

    async function chargerLivreurs() {


        try {


            const reponse =
                await fetch("/api/livreurs");


            if (!reponse.ok) {

                return;

            }


            listeLivreurs =
                await reponse.json();


            const conteneur =
                document.getElementById(
                    "liste-livreurs"
                );


            if (listeLivreurs.length === 0) {


                conteneur.innerHTML = `

                    <div class="message">

                        Aucun livreur.

                    </div>

                `;


                return;

            }


            let html = "";


            listeLivreurs.forEach(
                function(livreur) {


                    html += `

                        <div
                            class="carte-livreur"
                        >

                            🚚
                            ${livreur.nom}

                        </div>

                    `;

                }
            );


            conteneur.innerHTML = html;


            // Recharger les commandes après avoir récupéré
            // la liste des livreurs

            chargerCommandes();


        }


        catch (erreur) {

            console.log(
                "Erreur livreurs :",
                erreur
            );

        }

    }



    // =====================================================
    // RÉATTRIBUER UNE COMMANDE
    // =====================================================

    async function reattribuerCommande(commandeId) {


        const select =
            document.getElementById(
                "livreur-" + commandeId
            );


        const nomLivreur =
            select.value;


        if (!nomLivreur) {

            afficherNotification(
                "Veuillez choisir un livreur.",
                "erreur"
            );

            return;

        }


        try {


            const reponse =

                await fetch(
                    "/admin/attribuer/" + commandeId,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            livreur:
                                nomLivreur

                        })

                    }
                );


            const resultat =
                await reponse.json();


            if (!reponse.ok) {

                afficherNotification(
                    resultat.message ||
                    "Erreur lors de la réattribution.",
                    "erreur"
                );

                return;

            }


            afficherNotification(
                "Commande réattribuée à "
                + nomLivreur
                + " avec succès.",
                "succes"
            );


            chargerCommandes();

        }


        catch (erreur) {

            console.log(erreur);

            afficherNotification(
                "Une erreur est survenue.",
                "erreur"
            );

        }

    }



    // =====================================================
    // MODIFIER LE STATUT
    // =====================================================

    async function modifierStatut(commandeId) {


        const select =
            document.getElementById(
                "statut-" + commandeId
            );


        const nouveauStatut =
            select.value;


        if (!nouveauStatut) {

            afficherNotification(
                "Veuillez choisir un statut.",
                "erreur"
            );

            return;

        }


        try {


            const reponse =

                await fetch(
                    "/admin/statut/" + commandeId,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            statut:
                                nouveauStatut

                        })

                    }
                );


            const resultat =
                await reponse.json();


            if (!reponse.ok) {

                afficherNotification(
                    resultat.message ||
                    "Erreur lors de la modification.",
                    "erreur"
                );

                return;

            }


            afficherNotification(
                "Statut mis à jour avec succès.",
                "succes"
            );


            chargerCommandes();

        }


        catch (erreur) {

            console.log(erreur);

            afficherNotification(
                "Une erreur est survenue.",
                "erreur"
            );

        }

    }



    // =====================================================
    // DÉCONNEXION
    // =====================================================

    function deconnexion() {

        window.location.href =
            "/deconnexion";

    }



    // =====================================================
    // CHARGEMENT INITIAL
    // =====================================================

    chargerLivreurs();



    // =====================================================
    // ACTUALISATION AUTOMATIQUE
    // =====================================================

    setInterval(
        chargerCommandes,
        5000
    );


    setInterval(
        chargerLivreurs,
        10000
    );


</script>


</body>

</html>
