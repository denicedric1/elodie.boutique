<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assistance - Elodie Boutique</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .entete {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .entete h1 {
            margin: 0;
            color: #222;
        }

        .sous-titre {
            margin-top: 8px;
            color: #666;
        }

        .bouton-deconnexion {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        .bouton-deconnexion:hover {
            opacity: 0.85;
        }

        #liste-commandes {
            display: grid;
            gap: 20px;
        }

        .commande {
            background: white;
            padding: 22px;
            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .commande h2 {
            margin-top: 0;
            color: #222;
        }

        .information {
            margin: 8px 0;
        }

        .prix {
            font-size: 21px;
            font-weight: bold;
            margin-top: 15px;
        }

        .statut {
            margin-top: 15px;
            padding: 12px;
            background-color: #f1f3f5;
            border-radius: 7px;
            font-weight: bold;
        }

        .livreur {
            margin-top: 10px;
            font-weight: bold;
        }

        .zone-attribution {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        select {
            padding: 10px;
            margin-top: 8px;
            border-radius: 7px;
            border: 1px solid #ccc;
            min-width: 220px;
        }

        .bouton-attribuer {
            background-color: #1565c0;
            color: white;
            border: none;

            padding: 10px 16px;

            border-radius: 7px;
            cursor: pointer;

            margin-left: 8px;
        }

        .bouton-attribuer:hover {
            opacity: 0.85;
        }

        .message-vide {
            background: white;
            padding: 30px;

            text-align: center;

            border-radius: 12px;

            color: #666;
        }

        .actualisation {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .entete {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            select {
                width: 100%;
            }

            .bouton-attribuer {
                margin-left: 0;
                margin-top: 10px;
            }

        }

    </style>

</head>


<body>


    <div class="entete">

        <div>

            <h1>
                🎧 Assistance - Elodie Boutique
            </h1>

            <div class="sous-titre">
                Gestion et suivi des commandes
            </div>

            <div class="actualisation">
                Actualisation automatique toutes les 5 secondes
            </div>

        </div>


        <button
            class="bouton-deconnexion"
            onclick="deconnexion()"
        >

            Déconnexion

        </button>

    </div>


    <div id="liste-commandes">

        <div class="message-vide">

            Chargement des commandes...

        </div>

    </div>


    <script>


        let livreurs = [];


        // =================================================
        // MÉMORISER LES LIVREURS CHOISIS
        // =================================================

        let selectionsLivreurs = {};


        // =================================================
        // CHARGER LES LIVREURS
        // =================================================

        async function chargerLivreurs() {

            try {

                const reponse =
                    await fetch("/api/livreurs");


                if (!reponse.ok) {

                    livreurs = [];

                    return;

                }


                livreurs =
                    await reponse.json();

            }

            catch (erreur) {

                console.log(
                    "Erreur chargement livreurs :",
                    erreur
                );

                livreurs = [];

            }

        }


        // =================================================
        // CRÉER LES OPTIONS
        // =================================================

        function creerOptionsLivreurs(
            commande
        ) {

            let choixActuel =
                selectionsLivreurs[
                    commande.id
                ] || commande.livreur || "";


            let options = `

                <option value="">
                    Choisir un livreur
                </option>

            `;


            livreurs.forEach(
                function(livreur) {

                    const selectionne =
                        livreur.nom === choixActuel
                        ? "selected"
                        : "";


                    options += `

                        <option
                            value="${livreur.nom}"
                            ${selectionne}
                        >

                            ${livreur.nom}

                        </option>

                    `;

                }
            );


            return options;

        }


        // =================================================
        // CHARGER LES COMMANDES
        // =================================================

        async function chargerCommandes() {

            try {

                await chargerLivreurs();


                const reponse =
                    await fetch(
                        "/api/commandes"
                    );


                if (!reponse.ok) {

                    document.getElementById(
                        "liste-commandes"
                    ).innerHTML = `

                        <div class="message-vide">

                            Impossible de charger
                            les commandes.

                        </div>

                    `;

                    return;

                }


                const commandes =
                    await reponse.json();


                const liste =
                    document.getElementById(
                        "liste-commandes"
                    );


                liste.innerHTML = "";


                if (commandes.length === 0) {

                    liste.innerHTML = `

                        <div class="message-vide">

                            📦

                            <h2>
                                Aucune commande
                            </h2>

                            <p>
                                Il n'y a actuellement
                                aucune commande.
                            </p>

                        </div>

                    `;

                    return;

                }


                commandes.forEach(
                    function(commande) {

                        const bloc =
                            document.createElement(
                                "div"
                            );


                        bloc.className =
                            "commande";


                        bloc.innerHTML = `

                            <h2>

                                📦 Commande
                                ${commande.numero_commande}

                            </h2>


                            <div class="information">

                                <strong>
                                    Client :
                                </strong>

                                ${commande.nom_client}

                            </div>


                            <div class="information">

                                <strong>
                                    Téléphone :
                                </strong>

                                ${commande.telephone}

                            </div>


                            <div class="information">

                                <strong>
                                    Ville :
                                </strong>

                                ${commande.ville}

                            </div>


                            <div class="information">

                                <strong>
                                    Commune :
                                </strong>

                                ${commande.commune}

                            </div>


                            <div class="information">

                                <strong>
                                    Quartier :
                                </strong>

                                ${commande.quartier}

                            </div>


                            <div class="information">

                                <strong>
                                    Adresse :
                                </strong>

                                ${commande.adresse}

                            </div>


                            <div class="information">

                                <strong>
                                    Produit :
                                </strong>

                                ${commande.produits}

                            </div>


                            <div class="prix">

                                ${Number(
                                    commande.total
                                ).toLocaleString(
                                    "fr-FR"
                                )} FCFA

                            </div>


                            <div class="statut">

                                📊 Statut actuel :

                                ${commande.statut}

                            </div>


                            <div class="livreur">

                                🚚 Livreur :

                                ${commande.livreur ||
                                "Non attribué"}

                            </div>


                            <div class="zone-attribution">

                                <strong>
                                    Attribuer / changer
                                    le livreur :
                                </strong>


                                <br>


                                <select
                                    id="livreur-${commande.id}"
                                    onchange="
                                        memoriserSelection(
                                            ${commande.id},
                                            this.value
                                        )
                                    "
                                >

                                    ${creerOptionsLivreurs(
                                        commande
                                    )}

                                </select>


                                <button
                                    class="bouton-attribuer"

                                    onclick="
                                        attribuerLivreur(
                                            ${commande.id}
                                        )
                                    "
                                >

                                    Attribuer

                                </button>

                            </div>

                        `;


                        liste.appendChild(
                            bloc
                        );

                    }
                );

            }

            catch (erreur) {

                console.log(
                    "Erreur chargement commandes :",
                    erreur
                );

            }

        }


        // =================================================
        // MÉMORISER LE CHOIX
        // =================================================

        function memoriserSelection(
            commandeId,
            nomLivreur
        ) {

            selectionsLivreurs[
                commandeId
            ] = nomLivreur;

        }


        // =================================================
        // ATTRIBUER LE LIVREUR
        // =================================================

        async function attribuerLivreur(
            commandeId
        ) {

            const select =
                document.getElementById(
                    "livreur-" + commandeId
                );


            if (!select) {

                alert(
                    "Impossible de trouver le choix du livreur."
                );

                return;

            }


            const nomLivreur =
                select.value;


            if (!nomLivreur) {

                alert(
                    "Veuillez choisir un livreur."
                );

                return;

            }


            try {

                const reponse =
                    await fetch(
                        "/assistance/attribuer/"
                        + commandeId,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    livreur:
                                        nomLivreur

                                })

                        }
                    );


                const resultat =
                    await reponse.json();


                alert(
                    resultat.message
                );


                if (reponse.ok) {

                    selectionsLivreurs[
                        commandeId
                    ] = nomLivreur;

                }


                await chargerCommandes();

            }

            catch (erreur) {

                console.log(
                    erreur
                );

                alert(
                    "Une erreur est survenue."
                );

            }

        }


        // =================================================
        // DÉCONNEXION
        // =================================================

        function deconnexion() {

            window.location.href =
                "/deconnexion";

        }


        // =================================================
        // CHARGEMENT INITIAL
        // =================================================

        chargerCommandes();


        // =================================================
        // ACTUALISATION AUTOMATIQUE
        // =================================================

        setInterval(
            chargerCommandes,
            5000
        );


    </script>


</body>

</html>
